<section class="lx-auth-card" aria-labelledby="lx-login-title">
  <header class="lx-auth-card__header">
    <img src="assets/images/loanex-logo.png" alt="LoanEx" width="44" height="44" />
    <div>
      <h1 id="lx-login-title">Welcome to LoanEx</h1>
      <p>Enter your 10-digit mobile number to continue.</p>
    </div>
  </header>

  <form class="lx-auth-card__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="lx-field">
      <label class="lx-label" for="login-mobile">Mobile Number</label>
      <div style="display: flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 0.5rem; overflow: hidden; background: #fff;">
        <span style="padding: 0.75rem 1rem; background: #f8fafc; color: #475569; font-weight: 600; border-right: 1px solid #cbd5e1; font-size: 0.95rem;">+91</span>
        <input
          id="login-mobile"
          class="lx-input"
          style="border: none; flex: 1; padding: 0.75rem 1rem; outline: none; font-size: 1rem; font-weight: 500;"
          type="tel"
          formControlName="mobile"
          placeholder="Enter 10-digit mobile number"
          maxLength="10"
          (input)="onMobileInput($event)"
          [attr.aria-invalid]="form.controls.mobile.invalid && form.controls.mobile.touched"
        />
      </div>
      <app-form-field-error [control]="form.controls.mobile" label="Mobile number" />
    </div>

    @if (error(); as err) {
      <p class="lx-error-text" role="alert">{{ err }}</p>
    }

    <button type="submit" class="lx-btn lx-btn--primary lx-btn--block" [class.is-loading]="loading()" [disabled]="loading() || form.invalid">
      Get OTP
    </button>
  </form>
</section>

<app-otp-verification-dialog
  [visible]="otpOpen()"
  [mobile]="otpMobile()"
  [loading]="loading()"
  [error]="otpError()"
  [hint]="otpHint()"
  [length]="4"
  title="Verify Mobile OTP"
  (visibleChange)="otpOpen.set($event)"
  (verified)="onOtpVerified($event)"
  (resend)="onResendOtp()"
/>
